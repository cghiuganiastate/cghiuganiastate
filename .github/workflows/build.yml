name: Build FluidX3D

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: msbuild FluidX3D.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build Release
        run: msbuild FluidX3D.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidX3D-windows-x64
          path: bin/FluidX3D.exe
          retention-days: 30

      - name: Upload full build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidX3D-windows-x64-full
          path: bin/
          retention-days: 30
